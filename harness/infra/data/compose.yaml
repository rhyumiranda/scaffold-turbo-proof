# Fault injection for the data job: Toxiproxy between the apps and PostgreSQL / the API / Keycloak.
# Host networking so it can reach the services published on 127.0.0.1 and be reached on 127.0.0.1.
name: dro-data
services:
  toxiproxy:
    image: ghcr.io/shopify/toxiproxy:2.12.0@sha256:9378ed52a28bc50edc1350f936f518f31fa95f0d15917d6eb40b8e376d1a214e
    container_name: dro-toxiproxy
    network_mode: host
    command: ["-host=127.0.0.1", "-port=8474"]
    cpus: 2
    mem_limit: 2g
