version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Matches pnpm minimumReleaseAge: never propose a release younger than one day.
    cooldown:
      default-days: 1
    open-pull-requests-limit: 5
    groups:
      workspace:
        patterns: ['*']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  # Base images are pinned by digest; Dependabot proposes digest updates for both Dockerfiles.
  - package-ecosystem: docker
    directories: ['/apps/api', '/apps/web']
    schedule:
      interval: weekly
    cooldown:
      default-days: 1
